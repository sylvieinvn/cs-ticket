# Checks every push and pull request to main.
# Deployment itself is done by Vercel's Git integration: pushes to main go to production.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No package-lock.json yet; switch to `npm ci` once one is committed.
      - name: Install
        run: npm install --no-audit --no-fund

      # `next build` also type-checks the project.
      - name: Build
        run: npm run build
